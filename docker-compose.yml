services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: siroman
      POSTGRES_PASSWORD: siroman
      POSTGRES_DB: siroman
    volumes:
      - siroman_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siroman -d siroman"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siroman_pg:
